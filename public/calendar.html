<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן ביקורות | מערכת רישוי עסקים - מועצה אזורית יואב</title>
    
    <!-- Tailwind CSS (via CDN for single-file deployment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />

    <!-- Custom Config for Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for a more premium look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Fix Leaflet z-index issues with sticky headers (if map used) */
        .leaflet-container {
            z-index: 10 !important;
            font-family: inherit;
        }

        #calendar {
            background: white;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Right side: Logo & Brand -->
                <div class="flex items-center gap-3">
                    <div class="bg-brand-100 text-brand-700 p-2 rounded-lg">
                        <i class="fa-solid fa-building-shield text-xl"></i>
                    </div>
                    <div>
                        <a href="dashboard.html" class="text-lg font-bold text-slate-900 tracking-tight">מערכת רישוי עסקים</a>
                        <div class="text-xs text-slate-500 font-medium">מועצה אזורית יואב</div>
                    </div>
                </div>

                <!-- Center: Navigation -->
                <nav class="hidden md:flex space-x-reverse space-x-2">
                    <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i> לוח בקרה
                    </a>
                    <a href="businesses.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-store"></i> רשימת עסקים
                    </a>
                    <a href="inspection.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-brand-50 text-brand-700 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-check"></i> ביקורת חדשה
                    </a>
                    <span id="admin-link-placeholder"></span>
                </nav>

                <!-- Left side: User Profile & Actions -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 border-r border-slate-200 pr-4">
                        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-sm">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span id="user-name" class="text-sm font-medium text-slate-700">שלום, משתמש</span>
                    </div>
                    <button onclick="logout()" class="text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> יציאה
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">יומן ביקורות</h1>
            <p class="text-slate-500 text-sm mt-1">סנכרון עם יומן ה-Outlook והצגת הסמינר</p>
        </div>

        <div class="mb-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="font-bold text-slate-800 mb-3">סנכרון יומן</h2>
                <div class="flex flex-col lg:flex-row gap-3">
                    <input type="text" id="ical-url" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="הדבק כאן קישור iCal (לדוגמה: https://outlook.office365.com/.../calendar.ics)">
                    <button class="bg-brand-600 text-white px-6 py-2 rounded-lg hover:bg-brand-700 transition-colors" type="button" onclick="loadICal()">טען יומן</button>
                </div>
            </div>
        </div>

        <div id="calendar"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center flex flex-col items-center justify-center gap-2">
            <div class="text-sm text-slate-500 font-medium">
                &copy; 2026 מערכת רישוי עסקים - מועצה אזורית יואב. כל הזכויות שמורות.
            </div>
            <div class="text-xs text-slate-400">
                פותח עבור מחלקת רישוי עסקים
            </div>
        </div>
    </footer>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/he.js"></script>

    <script>
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        
        if (!token) {
            window.location.href = 'login.html';
        }

        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                document.getElementById('user-name').textContent = `שלום, ${user.fullName}`;
                if (user.role === 'admin') {
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin-dashboard.html';
                    adminLink.innerHTML = '<i class="fa-solid fa-user-shield"></i> פאנל ניהול';
                    adminLink.className = 'px-3 py-2 rounded-lg text-sm font-medium text-purple-600 hover:bg-purple-50 transition-colors flex items-center gap-2';
                    document.getElementById('admin-link-placeholder').appendChild(adminLink);
                }
            } catch(e) { console.error(e); }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'he',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [] // loaded dynamically later
            });
            calendar.render();
            window.calendarInstance = calendar;
        });

        async function loadICal() {
            const url = document.getElementById('ical-url').value;
            const button = document.querySelector('#ical-url + button');
            if (!url) return alert('אנא הזן כתובת iCal תקינה');
            button.disabled = true;
            button.textContent = 'טוען...';
            try {
                const response = await fetch('/api/calendar/ical', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ url })
                });
                if (response.ok) {
                    const events = await response.json();
                    window.calendarInstance.removeAllEvents();
                    window.calendarInstance.addEventSource(events);
                } else {
                    alert('שגיאה בטעינת היומן.');
                }
            } catch (err) {
                console.error(err);
                alert('שגיאת תקשורת. נסה שוב מאוחר יותר.');
            } finally {
                button.disabled = false;
                button.textContent = 'טען יומן';
            }
        }
    </script>
</body>
</html>
