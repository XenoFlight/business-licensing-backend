<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאנל ניהול | מערכת רישוי עסקים</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Config for Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .leaflet-container { z-index: 10 !important; font-family: inherit; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Right side: Logo & Brand -->
                <div class="flex items-center gap-3">
                    <div class="bg-purple-100 text-purple-700 p-2 rounded-lg">
                        <i class="fa-solid fa-user-shield text-xl"></i>
                    </div>
                    <div>
                        <a href="dashboard.html" class="text-lg font-bold text-slate-900 tracking-tight">פאנל ניהול</a>
                        <div class="text-xs text-slate-500 font-medium">מערכת רישוי עסקים</div>
                    </div>
                </div>

                <!-- Center: Navigation -->
                <nav class="hidden md:flex space-x-reverse space-x-2">
                    <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i> לוח בקרה
                    </a>
                    <a href="businesses.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-store"></i> רשימת עסקים
                    </a>
                    <a href="inspection.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-check"></i> ביקורת חדשה
                    </a>
                </nav>

                <!-- Left side: User Profile & Actions -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 border-r border-slate-200 pr-4">
                        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-sm">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span id="user-name" class="text-sm font-medium text-slate-700">שלום, משתמש</span>
                    </div>
                    <button onclick="logout()" class="text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> יציאה
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                <h2 class="font-bold text-slate-800 text-lg">משתמשים הממתינים לאישור</h2>
            </div>
            <div class="overflow-x-auto">
                <table id="pending-users-table" class="w-full text-sm text-right">
                    <thead class="bg-slate-50 text-slate-600 font-medium border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-3">שם מלא</th>
                            <th class="px-6 py-3">אימייל</th>
                            <th class="px-6 py-3">תפקיד</th>
                            <th class="px-6 py-3">תאריך הרשמה</th>
                            <th class="px-6 py-3">פעולה</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="px-6 py-8 text-center text-slate-500">טוען נתונים...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center flex flex-col items-center justify-center gap-2">
            <div class="text-sm text-slate-500 font-medium">
                &copy; 2026 מערכת רישוי עסקים - מועצה אזורית יואב. כל הזכויות שמורות.
            </div>
            <div class="text-xs text-slate-400">
                פותח עבור מחלקת רישוי עסקים
            </div>
        </div>
    </footer>

    <script>
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        let user;

        // Auth & Role Check
        if (!token || !userStr) {
            window.location.href = 'login.html';
        } else {
            user = JSON.parse(userStr);
            if (user.role !== 'admin') {
                alert('אין לך הרשאת גישה לדף זה.');
                window.location.href = 'dashboard.html';
            }
            document.getElementById('user-name').textContent = `שלום, ${user.fullName}`;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function fetchPendingUsers() {
            const tbody = document.querySelector('#pending-users-table tbody');
            try {
                const response = await fetch('/api/admin/pending-users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }

                const users = await response.json();
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">אין משתמשים הממתינים לאישור.</td></tr>';
                    return;
                }

                users.forEach(pendingUser => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50 transition-colors";
                    row.id = `user-row-${pendingUser.id}`;
                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium text-slate-900">${pendingUser.fullName}</td>
                        <td class="px-6 py-4 text-slate-600">${pendingUser.email}</td>
                        <td class="px-6 py-4 text-slate-600">${pendingUser.role}</td>
                        <td class="px-6 py-4 text-slate-600">${new Date(pendingUser.createdAt).toLocaleDateString('he-IL')}</td>
                        <td class="px-6 py-4 flex gap-2">
                            <button class="bg-green-600 text-white px-3 py-1.5 rounded text-xs hover:bg-green-700 transition-colors" onclick="approveUser(${pendingUser.id})">אשר משתמש</button>
                            <button class="bg-red-500 text-white px-3 py-1.5 rounded text-xs hover:bg-red-600 transition-colors" onclick="denyUser(${pendingUser.id})">דחה</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error('Error fetching pending users:', error);
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">שגיאה בטעינת המשתמשים.</td></tr>';
            }
        }

        async function approveUser(userId) {
            const button = document.querySelector(`#user-row-${userId} button`);
            button.disabled = true;
            button.textContent = 'מאשר...';

            try {
                const response = await fetch(`/api/admin/approve/${userId}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'שגיאה באישור המשתמש');
                }
                
                alert('המשתמש אושר בהצלחה!');
                document.getElementById(`user-row-${userId}`).remove();

                const tbody = document.querySelector('#pending-users-table tbody');
                if (tbody.children.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-500">אין משתמשים הממתינים לאישור.</td></tr>';
                }

            } catch (error) {
                console.error('Error approving user:', error);
                alert(`שגיאה: ${error.message}`);
                button.disabled = false;
                button.textContent = 'אשר משתמש';
            }
        }

        async function denyUser(userId) {
            if (!confirm('האם אתה בטוח שברצונך לדחות ולמחוק את המשתמש?')) return;

            const button = document.querySelector(`#user-row-${userId} .deny-btn`);
            button.disabled = true;
            button.textContent = '...';

            try {
                const response = await fetch(`/api/admin/deny/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'שגיאה בדחיית המשתמש');
                }
                
                alert('המשתמש נדחה ונמחק בהצלחה.');
                document.getElementById(`user-row-${userId}`).remove();

                const tbody = document.querySelector('#pending-users-table tbody');
                if (tbody.children.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-500">אין משתמשים הממתינים לאישור.</td></tr>';
                }

            } catch (error) {
                console.error('Error denying user:', error);
                alert(`שגיאה: ${error.message}`);
                button.disabled = false;
                button.textContent = 'דחה';
            }
        }

        // Initial Load
        fetchPendingUsers();
    </script>
</body>
</html>
